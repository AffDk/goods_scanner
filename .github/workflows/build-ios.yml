name: Build iOS IPA

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r GoodsScanner.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GoodsScanner-iOS
          path: GoodsScanner.ipa
